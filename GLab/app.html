<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1110"><link rel="icon" type="image/svg+xml" href="glab-icon.svg"><title>Your GLab workspace</title><link rel="stylesheet" href="account.css"><style>body{display:block;padding:0}.wrap{width:min(1080px,calc(100% - 40px));margin:auto}.bar{height:68px;border-bottom:1px solid #ffffff16;display:flex;align-items:center;justify-content:space-between}.bar a{text-decoration:none}.tools{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}.plain{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:none;color:var(--ink);cursor:pointer}.main{padding:48px 0}.main h1{font-size:36px;margin:7px 0;letter-spacing:-.05em}.sub{color:var(--muted);font-size:13px}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:24px}.tile{display:block;padding:17px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-decoration:none}.tile:hover{border-color:#648975}.tile b{color:var(--green);font:700 12px monospace}.tile h2{margin:12px 0 4px;font-size:15px}.tile p{margin:0;color:var(--muted);font-size:12px}.panel{padding:19px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:20px}.panel h2{margin:0 0 7px;font-size:17px}.panel p{color:var(--muted);font-size:13px;margin:0}.hide{display:none}.msg{color:var(--green)}@media(max-width:520px){.tools{gap:7px}.main{padding-top:34px}.main h1{font-size:30px}}</style></head><body><header class="bar"><div class="wrap" style="display:flex;justify-content:space-between;align-items:center;width:100%"><a class="brand" href="index.html"><span class="mark"><img src="glab-icon.svg" alt="" width="35" height="35"></span>GLab</a><div class="tools"><span id="who"></span><a id="adminLink" class="hide" href="admin.html">Admin</a><button id="out" class="plain">Sign out</button></div></div></header><main class="wrap main"><div class="eyebrow">Your workspace</div><h1 id="greeting">Welcome to GLab</h1><p id="description" class="sub">Checking your account access…</p><section id="notice" class="panel hide" aria-live="polite"></section><section id="labs" class="tiles"></section><section id="chat" class="panel hide"><h2>Mentoring chat</h2><p>Your chat access is enabled. Start a private conversation with Ghouse or another approved learner.</p><p style="margin-top:12px"><a href="chat.html">Open mentoring chat →</a></p></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const configured=!Object.values(firebaseConfig).some(v=>typeof v!=='string'||v.startsWith('REPLACE_')),notice=document.querySelector('#notice');let auth;if(!configured){notice.classList.remove('hide');notice.textContent='GLab account services are not connected yet.'}else{const app=initializeApp(firebaseConfig);auth=getAuth(app);const db=getFirestore(app);onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html');return}if(!user.emailVerified){location.replace('verify.html');return}document.querySelector('#who').textContent=user.email||'';document.querySelector('#greeting').textContent=`Welcome, ${user.displayName||'learner'}`;try{const [profileSnap,adminSnap]=await Promise.all([getDoc(doc(db,'glabUsers',user.uid)),getDoc(doc(db,'glabAdmins',user.uid))]);const profile=profileSnap.data()||{},admin=adminSnap.exists(),labs=admin?['c','cpp','java','python','r','go','linux','sql']:(profile.labs||[]);if(admin)document.querySelector('#adminLink').classList.remove('hide');if(profile.status!=='active'&&!admin){notice.classList.remove('hide');notice.innerHTML=profile.status==='suspended'?'<h2>Account paused</h2><p>Contact Ghouse if you think this is a mistake.</p>':'<h2>Account awaiting approval</h2><p>Your account is registered. Ghouse will approve it and assign your labs before you can start.</p>';document.querySelector('#description').textContent=profile.status==='suspended'?'Account access is paused.':'Your account is being reviewed.';return}document.querySelector('#description').textContent=admin?'Administrator access · all labs enabled':`${labs.length} lab${labs.length===1?'':'s'} available`;const titles={c:['C','C','Build a strong programming foundation.'],cpp:['C++','C++','Explore modern systems programming.'],java:['JVM','Java','Practise object-oriented development.'],python:['Py','Python','From first script to useful automation.'],r:['R','R','Work with data, analysis, and visuals.'],go:['Go','Go','Learn a simple, fast compiled language.'],linux:['$_','Linux','Get comfortable at the command line.'],sql:['SQL','SQL','Query and understand relational data.']},tiles=document.querySelector('#labs');for(const id of labs){const [icon,name,desc]=titles[id]||[];if(!name)continue;const a=document.createElement('a');a.className='tile';a.href=`lab.html?lab=${id}`;a.innerHTML=`<b>${icon}</b><h2>${name}</h2><p>${desc}</p>`;tiles.append(a)}if(!labs.length){notice.classList.remove('hide');notice.innerHTML='<h2>No labs assigned yet</h2><p>Ghouse will add the labs you are approved to use.</p>'}if(admin||profile.canMessage)document.querySelector('#chat').classList.remove('hide')}catch(e){notice.classList.remove('hide');notice.textContent='Could not load account access. Please try again.';console.error(e)}})}document.querySelector('#out').addEventListener('click',()=>{if(auth)signOut(auth).then(()=>location.replace('login.html'))})
</script></body></html>
