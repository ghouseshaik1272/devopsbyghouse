<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1110"><link rel="icon" type="image/svg+xml" href="glab-icon.svg"><title>Mentoring chat — GLab</title><link rel="stylesheet" href="account.css"><style>body{display:block;padding:0}.bar{height:64px;border-bottom:1px solid #ffffff14;padding:0 max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between}.bar a{text-decoration:none}.layout{width:min(1100px,calc(100% - 30px));height:calc(100vh - 98px);min-height:540px;margin:17px auto;display:grid;grid-template-columns:280px 1fr;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#101715}.side{padding:16px;border-right:1px solid var(--line);overflow:auto}.side h1{font-size:18px;margin:0 0 10px}.side select{width:100%;padding:9px;background:#0b1110;color:var(--ink);border:1px solid var(--line);border-radius:8px}.start{width:100%;margin-top:8px;padding:9px;border:0;border-radius:8px;background:var(--green);color:#092016;font-weight:700;cursor:pointer}.list{display:grid;gap:6px;margin-top:18px}.thread{width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid transparent;border-radius:8px;padding:10px;cursor:pointer}.thread:hover,.thread.active{border-color:#365244;background:#17231e}.thread small{display:block;color:var(--muted);margin-top:3px}.chat{display:flex;flex-direction:column;min-width:0}.chathead{height:59px;padding:0 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-weight:650}.messages{flex:1;overflow:auto;padding:17px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(75%,560px);align-self:flex-start;background:#1b2923;padding:10px 12px;border-radius:3px 12px 12px 12px;color:#e4eee8;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#254434;border-radius:12px 3px 12px 12px}.bubble small{display:block;color:#a3b7aa;font-size:10px;margin-top:5px}.compose{display:flex;gap:8px;padding:13px;border-top:1px solid var(--line)}.compose textarea{resize:none;flex:1;min-height:42px;max-height:120px;background:#0b1110;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px;font:inherit;font-size:13px}.compose button{align-self:end;padding:11px 14px;border:0;border-radius:8px;background:var(--green);color:#092016;font-weight:700;cursor:pointer}.compose button:disabled{opacity:.5}.placeholder{margin:auto;padding:25px;text-align:center;color:var(--muted);font-size:13px}.hint{font-size:11px;color:var(--muted);margin-top:8px}.hide{display:none}@media(max-width:650px){.layout{grid-template-columns:130px 1fr}.side{padding:9px}.side h1{font-size:14px}.thread{padding:8px;font-size:11px}.thread small{font-size:9px}.compose{padding:8px}.bubble{max-width:90%}}</style></head><body><header class="bar"><a class="brand" href="app.html"><span class="mark"><img src="glab-icon.svg" alt="" width="35" height="35"></span>GLab chat</a><a href="app.html">← Workspace</a></header><main class="layout"><aside class="side"><h1>Mentoring</h1><label for="contact" class="hint">New conversation</label><select id="contact"><option value="">Loading members…</option></select><button id="start" class="start">Start chat</button><p class="hint">Only members with chat access appear here.</p><div id="threads" class="list"></div></aside><section class="chat"><div id="chathead" class="chathead">Choose a conversation</div><div id="messages" class="messages"><div class="placeholder">Your private mentoring conversations will appear here.</div></div><form id="compose" class="compose"><textarea id="text" maxlength="4000" placeholder="Write a message…" aria-label="Message" disabled></textarea><button id="send" disabled>Send</button></form></section></main><div id="status" class="status" style="width:min(1100px,calc(100% - 30px));margin:-9px auto 15px" role="status" aria-live="polite"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,doc,getDoc,collection,query,where,orderBy,getDocs,addDoc,setDoc,serverTimestamp,onSnapshot}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const configured=!Object.values(firebaseConfig).some(v=>typeof v!=='string'||v.startsWith('REPLACE_')),status=document.querySelector('#status'),contacts=document.querySelector('#contact'),threadList=document.querySelector('#threads'),messageList=document.querySelector('#messages');document.querySelector('#start').disabled=true;let db,user,activeChat='',activePeer='',unsubscribeMessages;const say=s=>status.textContent=s;function safe(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}async function openChat(id,peer){activeChat=id;activePeer=peer;document.querySelectorAll('.thread').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const member=await getDoc(doc(db,'glabMembers',peer)),name=member.data()?.name||'GLab member';document.querySelector('#chathead').textContent=name;document.querySelector('#text').disabled=false;document.querySelector('#send').disabled=false;if(unsubscribeMessages)unsubscribeMessages();messageList.replaceChildren(safe('div','placeholder','Loading messages…'));const q=query(collection(db,'glabChats',id,'messages'),orderBy('createdAt','asc'));unsubscribeMessages=onSnapshot(q,snap=>{messageList.replaceChildren();for(const d of snap.docs){const m=d.data(),bubble=safe('div','bubble'+(m.authorUid===user.uid?' mine':''),m.text),date=m.createdAt?.toDate?.().toLocaleString()||'';bubble.append(safe('small','',date));messageList.append(bubble)}messageList.scrollTop=messageList.scrollHeight;if(!snap.size)messageList.append(safe('div','placeholder','Say hello and start the conversation.'))},()=>say('Could not load this conversation.'));say('Messages are private to conversation participants and the GLab administrator.')}async function renderThreads(){const q=query(collection(db,'glabChats'),where('participants','array-contains',user.uid)),snap=await getDocs(q);threadList.replaceChildren();for(const d of snap.docs){const peer=d.data().participants.find(x=>x!==user.uid);if(!peer)continue;const member=await getDoc(doc(db,'glabMembers',peer));const b=safe('button','thread',member.data()?.name||'GLab member');b.type='button';b.dataset.id=d.id;b.append(safe('small','',`Conversation · ${d.id.slice(0,7)}`));b.addEventListener('click',()=>openChat(d.id,peer));threadList.append(b)}}async function loadContacts(){const q=query(collection(db,'glabMembers'),where('status','==','active'),where('canMessage','==',true)),snap=await getDocs(q);contacts.replaceChildren(new Option('Choose an approved member',''));for(const d of snap.docs){if(d.id===user.uid)continue;const m=d.data(),option=new Option(m.name||'GLab member',d.id);contacts.add(option)}if(contacts.options.length===1)contacts.options[0].textContent='No other chat-enabled members yet'}if(!configured)say('The dedicated GLab account service is not configured yet.');else{const app=initializeApp(firebaseConfig);db=getFirestore(app);onAuthStateChanged(getAuth(app),async u=>{if(!u){location.replace('login.html');return}user=u;try{const [profile,admin]=await Promise.all([getDoc(doc(db,'glabUsers',u.uid)),getDoc(doc(db,'glabAdmins',u.uid))]);if(!admin.exists()&&(profile.data()?.status!=='active'||profile.data()?.emailVerified!==true||profile.data()?.canMessage!==true)){location.replace('app.html');return}await Promise.all([loadContacts(),renderThreads()]);document.querySelector("#start").disabled=false}catch{say('Could not load chat access. Check your account permissions.')}})}document.querySelector('#start').addEventListener('click',async()=>{const peer=contacts.value;if(!peer)return;try{const ids=[user.uid,peer].sort(),id=ids.join('__'),ref=doc(db,'glabChats',id),existing=await getDoc(ref);if(!existing.exists())await setDoc(ref,{participants:ids,createdAt:serverTimestamp()});await renderThreads();await openChat(id,peer)}catch{say('Could not start this chat. Check that both members have chat permission.')}});document.querySelector('#compose').addEventListener('submit',async e=>{e.preventDefault();const text=document.querySelector('#text'),send=document.querySelector('#send'),value=text.value.trim();if(!activeChat||!value)return;send.disabled=true;try{await addDoc(collection(db,'glabChats',activeChat,'messages'),{authorUid:user.uid,text:value,createdAt:serverTimestamp()});text.value=''}catch{say('Message could not be sent. Check your chat access and try again.')}finally{send.disabled=false}})
</script></body></html>
