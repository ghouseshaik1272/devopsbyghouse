<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1110"><link rel="icon" type="image/svg+xml" href="glab-icon.svg"><title>Sign in to GLab</title><link rel="stylesheet" href="account.css"></head><body><main class="shell"><div class="top"><a class="brand" href="index.html"><span class="mark"><img src="glab-icon.svg" alt="" width="35" height="35"></span>GLab</a><a href="index.html">Back to GLab</a></div><section class="card"><div class="eyebrow">Welcome back</div><h1>Sign in to GLab</h1><p class="intro">Use the email and password for your registered account.</p><form id="form"><label class="label" for="email">Email address</label><input class="field" id="email" type="email" autocomplete="username" required><label class="label" for="password">Password</label><input class="field" id="password" type="password" autocomplete="current-password" required><div id="status" class="status" role="alert" aria-live="polite"></div><button id="submit" class="btn">Sign in</button></form><div id="configNotice" class="notice" hidden>Account sign-in is not connected yet. Please check back after GLab opens.</div></section><div class="foot">Need an account? <a href="register.html">Register here</a></div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,doc,getDoc,writeBatch,serverTimestamp,updateDoc}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const form=document.querySelector('#form'),status=document.querySelector('#status'),submit=document.querySelector('#submit'),configured=!Object.values(firebaseConfig).some(v=>typeof v!=='string'||v.startsWith('REPLACE_'));if(!configured){form.hidden=true;document.querySelector('#configNotice').hidden=false}else{const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);form.addEventListener('submit',async e=>{e.preventDefault();status.className='status';status.textContent='Signing in…';submit.disabled=true;try{const cred=await signInWithEmailAndPassword(auth,document.querySelector('#email').value.trim(),document.querySelector('#password').value);if(!cred.user.emailVerified){location.replace('verify.html');return}const ref=doc(db,'glabUsers',cred.user.uid),snap=await getDoc(ref);if(!snap.exists()){const batch=writeBatch(db);batch.set(ref,{uid:cred.user.uid,name:cred.user.displayName||'',email:cred.user.email,details:'',emailVerified:true,status:'pending',labs:[],canMessage:false,createdAt:serverTimestamp()});batch.set(doc(db,'glabMembers',cred.user.uid),{uid:cred.user.uid,name:cred.user.displayName||'',status:'pending',canMessage:false});await batch.commit()}else if(snap.data().emailVerified!==true){await updateDoc(ref,{emailVerified:true})}location.replace('app.html')}catch(e){status.className='status error';status.textContent=({'auth/invalid-credential':'Email or password is incorrect.','auth/user-not-found':'No account found for that email.','auth/too-many-requests':'Too many attempts. Wait a while and try again.'})[e.code]||'Could not sign in. Please try again.';submit.disabled=false}})}
</script></body></html>
