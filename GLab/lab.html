<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1110"><link rel="icon" type="image/svg+xml" href="glab-icon.svg"><title>GLab playground</title><link rel="stylesheet" href="account.css"><link rel="stylesheet" href="exercises.css"><style>body{display:block;padding:0}.bar{height:65px;border-bottom:1px solid #ffffff14;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1100px)/2))}.bar a{text-decoration:none}.plain{color:var(--green);font-size:12px}.work{width:min(1100px,calc(100% - 36px));margin:35px auto}.head{display:flex;align-items:end;justify-content:space-between;gap:15px}.head h1{margin:4px 0;font-size:32px;letter-spacing:-.04em}.head p{margin:0;color:var(--muted);font-size:12px}.editor{display:none;margin-top:20px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0a100e}.editbar{height:43px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;border-bottom:1px solid var(--line);color:var(--muted);font:11px monospace}.editbar button{border:0;border-radius:7px;padding:7px 13px;background:var(--green);color:#092016;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.editbar button:disabled{opacity:.55;cursor:not-allowed}textarea{display:block;width:100%;min-height:330px;resize:vertical;background:#0b1110;color:#dcebe2;border:0;padding:18px;font:13px/1.65 "SFMono-Regular",Consolas,monospace;tab-size:2;outline:none}.out{min-height:94px;padding:13px 17px;border-top:1px solid var(--line);color:#b9c8c0;font:12px/1.6 monospace;white-space:pre-wrap}.note{margin-top:14px;padding:13px 15px;border:1px solid #5a5134;border-radius:10px;background:#292317;color:#ead9a4;font-size:12px}.hide{display:none}@media(max-width:560px){.head{align-items:start;flex-direction:column}.head h1{font-size:28px}textarea{min-height:260px}}</style></head><body><header class="bar"><a class="brand" href="app.html"><span class="mark"><img src="glab-icon.svg" alt="" width="35" height="35"></span>GLab</a><a class="plain" href="app.html">← My labs</a></header><main class="work"><div class="head"><div><div class="eyebrow">Practice space</div><h1 id="title">Loading lab…</h1><p id="hint">Your work runs in an isolated environment.</p></div><span id="version" class="hint"></span></div><div id="note" class="note hide" role="status"></div><section id="starter" class="starter" aria-labelledby="exercise-title" hidden><div class="starter-top"><div><div class="starter-kicker">Beginner challenge</div><h2 id="exercise-title"></h2><p class="starter-intro">Try it yourself first. The hint and sample solution are below when you need them.</p></div><span class="level">STARTER</span></div><div class="starter-grid"><article class="starter-card"><h3>Your task</h3><p id="exercise-objective"></p></article><article class="starter-card"><h3>Expected result</h3><pre id="exercise-expected"></pre></article></div><div class="starter-details"><details class="starter-detail"><summary>Hint</summary><p id="exercise-hint"></p></details><details class="starter-detail"><summary>Sample solution</summary><pre id="exercise-solution"></pre></details></div></section><section class="editor"><div class="editbar"><span id="filename">main</span><button id="run" disabled>Run code</button></div><textarea id="source" spellcheck="false" aria-label="Code editor"></textarea><div id="output" class="out">Output will appear here.</div></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';import{runnerConfig}from'./runner-config.js';
const catalog={c:{name:'C',file:'main.c',lang:'c',sample:'#include <stdio.h>\n\nint main(void) {\n    printf("Hello, GLab!\\n");\n    return 0;\n}'},cpp:{name:'C++',file:'main.cpp',lang:'cpp',sample:'#include <iostream>\n\nint main() {\n    std::cout << "Hello, GLab!\\n";\n    return 0;\n}'},java:{name:'Java',file:'Main.java',lang:'java',sample:'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, GLab!");\n    }\n}'},python:{name:'Python',file:'main.py',lang:'python',sample:'print("Hello, GLab!")'},r:{name:'R',file:'main.R',lang:'r',sample:'message("Hello, GLab!")'},go:{name:'Go',file:'main.go',lang:'go',sample:'package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello, GLab!")\n}'},linux:{name:'Linux',file:'terminal',lang:'linux',sample:'printf "Hello, GLab!\\n"\npwd\nls'},sql:{name:'SQL',file:'query.sql',lang:'sql',sample:'SELECT \'Hello, GLab!\' AS greeting;'}};const id=new URLSearchParams(location.search).get('lab'),lab=catalog[id];if(!lab){location.replace('app.html')}else{document.querySelector('#title').textContent=`${lab.name} lab`;document.querySelector('#filename').textContent=lab.file;document.querySelector('#source').value=lab.sample;if(id==='linux')document.querySelector('#hint').textContent='A disposable Linux shell opens after a secure terminal service is connected.'}const configured=!Object.values(firebaseConfig).some(v=>typeof v!=='string'||v.startsWith('REPLACE_')),runnerReady=typeof runnerConfig.endpoint==='string'&&!runnerConfig.endpoint.startsWith('REPLACE_'),note=document.querySelector('#note'),run=document.querySelector('#run');if(!configured){note.classList.remove('hide');note.textContent='Account access is being connected. You can preview this challenge now; sign-in and code execution will open after setup.'}else if(!runnerReady){note.classList.remove('hide');note.textContent='The secure code runner is not connected yet. Your lab access will appear here after Ghouse connects the isolated execution service.'}if(configured){const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html');return}if(!lab)return;try{const [p,a]=await Promise.all([getDoc(doc(db,'glabUsers',user.uid)),getDoc(doc(db,'glabAdmins',user.uid))]),profile=p.data()||{},admin=a.exists();if(!admin&&(profile.status!=='active'||profile.emailVerified!==true||!(profile.labs||[]).includes(id))){location.replace('app.html');return}if(runnerReady)run.disabled=false;document.querySelector('.editor').style.display='block'}catch{location.replace('app.html')}})}run.addEventListener('click',async()=>{if(!runnerReady)return;run.disabled=true;const output=document.querySelector('#output');output.textContent='Running…';try{const user=getAuth(initializeApp(firebaseConfig)).currentUser,token=await user.getIdToken(),response=await fetch(runnerConfig.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({lab:id,source:document.querySelector('#source').value})});const data=await response.json();output.textContent=data.output||data.error||'Execution completed.'}catch{output.textContent='Could not reach the secure runner.'}finally{run.disabled=false}})
</script><script type="module">
import {exercises} from './exercises.js';
const id=new URLSearchParams(location.search).get('lab'),exercise=exercises[id];
if(exercise){
  document.querySelector('#exercise-title').textContent=exercise.title;
  document.querySelector('#exercise-objective').textContent=exercise.objective;
  document.querySelector('#exercise-hint').textContent=exercise.hint;
  document.querySelector('#exercise-solution').textContent=exercise.solution;
  document.querySelector('#exercise-expected').textContent=exercise.expected;
  document.querySelector('#starter').hidden=false;
  document.querySelector('#source').value=exercise.starter;
}
</script></body></html>
