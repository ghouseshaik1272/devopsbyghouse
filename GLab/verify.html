<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1110"><link rel="icon" type="image/svg+xml" href="glab-icon.svg"><title>Verify your email — GLab</title><link rel="stylesheet" href="account.css"></head><body><main class="shell"><div class="top"><a class="brand" href="index.html"><span class="mark"><img src="glab-icon.svg" alt="" width="35" height="35"></span>GLab</a><a href="index.html">Back to GLab</a></div><section class="card"><div class="eyebrow">One quick step</div><h1>Verify your email</h1><p class="intro">We sent a verification link to <strong id="email">your email address</strong>. Verify it, then check again to continue.</p><button id="check" class="btn">I've verified — check again</button><button id="resend" class="btn" style="background:#20342a;color:#dcebe2">Resend verification email</button><div id="status" class="status" role="status" aria-live="polite"></div><div id="configNotice" class="notice" hidden>The GLab account service is not connected yet.</div></section><div class="foot"><button id="signOut" class="plain">Sign out</button></div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,onAuthStateChanged,sendEmailVerification,signOut}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,doc,getDoc,updateDoc}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const configured=!Object.values(firebaseConfig).some(v=>typeof v!=='string'||v.startsWith('REPLACE_')),status=document.querySelector('#status');let auth,db,user;function say(text,bad=false){status.className='status'+(bad?' error':'');status.textContent=text}if(!configured){document.querySelector('#configNotice').hidden=false;document.querySelector('#check').disabled=true;document.querySelector('#resend').disabled=true}else{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,u=>{if(!u){location.replace('login.html');return}user=u;document.querySelector('#email').textContent=u.email||'your email address';if(u.emailVerified)location.replace('app.html')})}document.querySelector('#check').addEventListener('click',async()=>{if(!user)return;try{await user.reload();await user.getIdToken(true);if(!user.emailVerified){say('The email is not verified yet. Open the link from your inbox, then check again.');return}const profile=doc(db,'glabUsers',user.uid),snap=await getDoc(profile);if(snap.exists()&&snap.data().emailVerified!==true)await updateDoc(profile,{emailVerified:true});location.replace('app.html')}catch{say('Could not confirm yet. Open the email link and try again.',true)}});document.querySelector('#resend').addEventListener('click',async()=>{if(!user)return;try{await sendEmailVerification(user);say('A new verification email is on its way.')}catch{say('Could not send another email yet. Check your inbox or wait a few minutes.',true)}});document.querySelector('#signOut').addEventListener('click',()=>auth&&signOut(auth).then(()=>location.replace('login.html')))
</script></body></html>
