<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103c31"><title>Admin — Salah Reminder</title><style>
:root{--green:#103c31;--cream:#f5f4ed;--ink:#182621;--muted:#75847c;--line:#e4e9e3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;background:var(--green);color:#fff;border-radius:16px;padding:17px 20px}.top strong{font-size:19px}.top a{color:#d7e8de}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;overflow:auto}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.toolbar input{padding:10px;border:1px solid var(--line);border-radius:10px;min-width:220px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:white;font-weight:700;cursor:pointer}.status{padding:16px;color:#49665b;font-weight:650}.muted{color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:10px;border-bottom:1px solid #eef1ed}th{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px}.tabs button{background:#edf4ef;color:var(--green)}.tabs button.active{background:var(--green);color:white}.hide{display:none!important}
</style></head><body><main class="wrap"><header class="top"><strong>Salah Reminder · Admin</strong><a href="index.html">Open app</a></header><div class="status" id="status" role="status">Checking admin access…</div><section id="dashboard" class="hide"><div class="toolbar"><strong id="count">Users</strong><input id="search" type="search" placeholder="Filter by name, email, or UID"><button class="btn" id="exportUsers">Export users CSV</button><button class="btn" id="exportActivity">Export activity CSV</button><button class="btn" id="refresh">Refresh</button><button class="btn" id="signOut">Sign out</button></div><p class="muted">Shows up to 500 recent users and activity events. This view contains personal data and is restricted to admins.</p><div class="tabs"><button class="btn active" data-tab="users">Users</button><button class="btn" data-tab="activity">Activity</button></div><div class="panel" id="usersPanel"><table><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last active</th><th>Times</th><th>Changes this month</th><th>User ID</th></tr></thead><tbody id="usersBody"></tbody></table></div><div class="panel hide" id="activityPanel"><table><thead><tr><th>When</th><th>Event</th><th>Details</th><th>User ID</th></tr></thead><tbody id="activityBody"></tbody></table></div></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';import{getFirestore,doc,getDoc,collection,query,orderBy,limit,getDocs}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const status=document.querySelector('#status'),dashboard=document.querySelector('#dashboard');if(Object.values(firebaseConfig).some(v=>typeof v!=='string'||v.startsWith('REPLACE_'))){status.textContent='Firebase setup is not finished.';throw new Error('Firebase config missing');}const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let users=[],activity=[];function date(v){return v?.toDate?v.toDate().toLocaleString():v?new Date(v).toLocaleString():'—'}function cell(row,v){const td=document.createElement('td');td.textContent=v==null?'':String(v);row.append(td)}function csv(rows){return rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n')}function download(name,rows){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv(rows)],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),matches=users.filter(u=>`${u.name} ${u.email} ${u.uid}`.toLowerCase().includes(q));document.querySelector('#count').textContent=`${users.length} users loaded${users.length===500?' (maximum 500)':''}`;const body=document.querySelector('#usersBody');body.replaceChildren();for(const u of matches){const tr=document.createElement('tr');cell(tr,u.name||'—');cell(tr,u.email||'—');cell(tr,date(u.createdAt));cell(tr,date(u.lastActiveAt));cell(tr,(u.prayerTimes||[]).join(' · ')||'Not set');cell(tr,`${u.editsUsed||0}/3`);cell(tr,u.uid);body.append(tr)}const ab=document.querySelector('#activityBody');ab.replaceChildren();for(const e of activity){const tr=document.createElement('tr');cell(tr,date(e.occurredAt));cell(tr,e.event);cell(tr,Object.entries(e.details||{}).map(([k,v])=>`${k}: ${v}`).join(', '));cell(tr,e.uid);ab.append(tr)}}async function load(){status.textContent='Loading admin data…';try{const [us,ev]=await Promise.all([getDocs(query(collection(db,'users'),orderBy('createdAt','desc'),limit(500))),getDocs(query(collection(db,'activity'),orderBy('occurredAt','desc'),limit(500)))]);users=us.docs.map(d=>({uid:d.id,...d.data()}));activity=ev.docs.map(d=>d.data());dashboard.classList.remove('hide');status.textContent='';render()}catch(e){status.textContent='Could not load admin data. Check your admin access and Firestore rules.';console.error(e)}}onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html');return}try{const snap=await getDoc(doc(db,'admins',user.uid));if(!snap.exists()||snap.data().role!=='admin'){status.textContent='This account does not have admin access.';return}await load()}catch{status.textContent='Could not verify admin access.'}});document.querySelector('#search').addEventListener('input',render);document.querySelector('#refresh').addEventListener('click',load);document.querySelector('#signOut').addEventListener('click',()=>signOut(auth));document.querySelector('#exportUsers').addEventListener('click',()=>download('salah-users.csv',[['Name','Email','Joined','Last active','Prayer times','Edits used','UID'],...users.map(u=>[u.name,u.email,date(u.createdAt),date(u.lastActiveAt),(u.prayerTimes||[]).join(' '),u.editsUsed,u.uid])]));document.querySelector('#exportActivity').addEventListener('click',()=>download('salah-activity.csv',[['Occurred at','Event','Details','UID'],...activity.map(e=>[date(e.occurredAt),e.event,JSON.stringify(e.details||{}),e.uid])]));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#usersPanel').classList.toggle('hide',b.dataset.tab!=='users');document.querySelector('#activityPanel').classList.toggle('hide',b.dataset.tab!=='activity')}));
</script></body></html>
