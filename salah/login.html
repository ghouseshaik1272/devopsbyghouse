<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103c31"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"><title>Sign in — Salah Reminder</title>
<style>:root{--green:#103c31;--green2:#1d604d;--cream:#f5f4ed;--ink:#182621;--muted:#75847c;--line:#e4e9e3;--gold:#e5b75b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(100%,420px)}.brand{display:flex;align-items:center;justify-content:space-between;background:var(--green);color:white;padding:17px 19px;border-radius:18px;margin-bottom:24px;font-weight:750;font-size:19px}.brand a{color:#d6e6dd;text-decoration:none;font-size:13px;font-weight:550}.brand b{color:var(--gold)}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 10px 28px #1826210a}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}.panel h1{font-size:27px;line-height:1.16;margin:8px 0}.sub{color:var(--muted);font-size:14px;margin:0 0 23px}.field-label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 12px;font:500 16px system-ui;color:var(--ink);background:white}.field:focus{outline:2px solid #79a997;outline-offset:2px}.btn{border:0;border-radius:13px;padding:14px 16px;background:var(--green);color:white;font-size:15px;font-weight:700;width:100%;cursor:pointer;margin-top:12px}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.secondary{background:#edf4ef;color:var(--green)}.back{display:inline-block;color:var(--green2);font-size:13px;font-weight:650;text-decoration:none;margin:0 0 16px}.note{margin-top:15px;background:#f5f8f5;border-radius:12px;padding:11px 12px;color:#62746a;font-size:12px}.error{color:#a53737;font-size:13px;min-height:20px;margin:12px 0 0}.privacy{text-align:center;font-size:12px;color:var(--muted);margin:15px 0 0}.consent{display:flex;align-items:flex-start;gap:9px;margin:15px 0 5px;font-size:12px;line-height:1.4;color:#62746a}.consent input{margin-top:2px;accent-color:var(--green)}</style>
</head><body><main class="shell"><div class="brand"><span>Salah<b>•</b></span><a href="../index.html">DevOps by Ghouse</a></div><a class="back" href="../index.html">← Back to home</a><section class="panel"><div class="eyebrow">Your salah companion</div><h1 id="title">Welcome</h1><p class="sub" id="subtitle">Sign in or ask to join. No password needed; we’ll email you a secure sign-in link.</p><label class="field-label" for="name">Your name</label><input class="field" id="name" type="text" maxlength="80" autocomplete="name" placeholder="Name"><label class="field-label" for="email">Email address</label><input class="field" id="email" type="email" autocomplete="email" placeholder="you@example.com"><label class="consent"><input id="consent" type="checkbox"><span>I agree that Salah admins can view my name, email address, prayer times, and reminder activity.</span></label><div class="error" id="error" role="alert" aria-live="polite"></div><button class="btn" id="request" type="button">Ask for approval</button><button class="btn secondary" id="signIn" type="button">Login</button><div class="note">We’ll send a secure link to your email. New accounts need admin approval before using reminders.</div></section><p class="privacy">A gentle reminder for the Ummah 🤍</p></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import{getAuth,sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink,updateProfile}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const errorEl=document.querySelector('#error'),buttons=[...document.querySelectorAll('.btn')],nameEl=document.querySelector('#name'),emailEl=document.querySelector('#email'),consent=document.querySelector('#consent'),adminEmail='shaikdigitalservicespvtltd@gmail.com';
const configured=!Object.values(firebaseConfig).some(v=>typeof v!=='string'||v.startsWith('REPLACE_'));
if(!configured){errorEl.textContent='Firebase setup is not finished yet. Please try again later.';buttons.forEach(b=>b.disabled=true)}else{
 const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),profileRef=uid=>doc(db,'users',uid);
 function valid(){if(!consent.checked){errorEl.textContent='Please agree before continuing.';return false}if(!emailEl.value.trim()){errorEl.textContent='Enter your email address.';return false}if(!emailEl.validity.valid){errorEl.textContent='Enter a valid email address.';return false}errorEl.textContent='';return true}
 function message(e){return({'auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many attempts. Please wait and try again.','auth/unauthorized-continue-uri':'This website is not authorized for email sign-in yet. Ask the admin to enable Email link sign-in in Firebase.'})[e.code]||'Could not send the sign-in link. Please try again.'}
 async function send(intent){if(!valid())return;if(intent==='register'&&!nameEl.value.trim()){errorEl.textContent='Enter your name to request approval.';nameEl.focus();return}buttons.forEach(b=>b.disabled=true);errorEl.style.color='#62746a';errorEl.textContent='Sending your secure link…';try{localStorage.setItem('salah-email-link',emailEl.value.trim());localStorage.setItem('salah-email-intent',intent);if(intent==='register')localStorage.setItem('salah-pending-name',nameEl.value.trim());await sendSignInLinkToEmail(auth,emailEl.value.trim(),{url:new URL('login.html',location.href).href,handleCodeInApp:true});errorEl.textContent='Check your email and open the secure link on this device to continue.'}catch(e){errorEl.style.color='#a53737';errorEl.textContent=message(e);buttons.forEach(b=>b.disabled=false)}}
 document.querySelector('#request').addEventListener('click',()=>send('register'));
 document.querySelector('#signIn').addEventListener('click',()=>send('login'));
 if(isSignInWithEmailLink(auth,location.href)){
   const email=localStorage.getItem('salah-email-link')||prompt('Enter the email address where you received the sign-in link:');
   if(!email){errorEl.textContent='Enter your email address to finish sign-in.'}
   else{buttons.forEach(b=>b.disabled=true);errorEl.style.color='#62746a';errorEl.textContent='Verifying your email…';try{
     const credential=await signInWithEmailLink(auth,email,location.href);await credential.user.reload();const user=auth.currentUser,intent=localStorage.getItem('salah-email-intent'),ref=profileRef(user.uid),snap=await getDoc(ref);
     if(!snap.exists()){
       if(intent!=='register'){await auth.signOut();throw new Error('No approved account was found. Choose “Ask for approval” to request access.')}
       const name=localStorage.getItem('salah-pending-name')||'Member';await updateProfile(user,{displayName:name});await setDoc(ref,{uid:user.uid,name,email:user.email,prayerTimes:['','','','',''],tone:'gentle',hasInitialTimes:false,editMonthStart:null,editsUsed:0,approvalStatus:'pending',approvalRequestedAt:serverTimestamp(),approvalReviewedAt:null,approvalReviewedBy:null,createdAt:serverTimestamp(),lastActiveAt:serverTimestamp()});errorEl.textContent=`JazakAllahu khairan, ${name}. Your request is waiting for admin approval. You’ll be able to sign in when it’s approved.`;localStorage.removeItem('salah-email-intent');localStorage.removeItem('salah-pending-name');localStorage.removeItem('salah-email-link');buttons.forEach(b=>b.disabled=false);return
     }
     const profile=snap.data();if(profile.approvalStatus==='pending'){errorEl.textContent='Your request is awaiting admin approval. Please try again later.';buttons.forEach(b=>b.disabled=false);return}if(profile.approvalStatus==='rejected'){errorEl.textContent='Your access request was declined. Contact the Salah administrator.';buttons.forEach(b=>b.disabled=false);return}
     if((user.email||'').toLowerCase()===adminEmail&&!user.emailVerified){errorEl.textContent='Verify the admin email address before continuing.';return}
     localStorage.removeItem('salah-email-intent');localStorage.removeItem('salah-pending-name');localStorage.removeItem('salah-email-link');location.replace('index.html')
   }catch(e){errorEl.style.color='#a53737';errorEl.textContent=e.message||message(e);buttons.forEach(b=>b.disabled=false)}}
 }
}
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
